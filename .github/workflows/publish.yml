name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # lets npm verify this workflow (trusted publishing) and sign provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Release builds install from scratch, never from a cache.
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Skip if this version is already on npm
        id: npm
        run: |
          if npm view "$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      # Authenticates through trusted publishing (OIDC), with no token. npm adds
      # provenance automatically when the repository is public.
      - if: steps.npm.outputs.published != 'true'
        run: npm publish
